name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Type check, lint, unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Start local Supabase (applies migrations and seed)
        run: |
          cp .env.example .env.local
          cp supabase/functions/.env.example supabase/functions/.env
          npx supabase start

      - name: Database tests (RLS, history, votes, search)
        run: npm run db:test

      - name: Generated types match the schema
        run: |
          npm run db:types
          git diff --exit-code src/lib/supabase/database.types.ts

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
